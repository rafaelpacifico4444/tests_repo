name: Docker Build and Push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        description: "Versão semântica sem o 'v' (ex.: 0.3.0-rc.2)"
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
    outputs:
      image-tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Definir nome e tags da imagem
        id: vars
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE"
          {
            echo "image=$IMAGE"
            echo "tag=$VERSION"
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${GITHUB_SHA::7}"
            # a tag móvel 'staging' só é atualizada a partir da branch staging
            if [ "$REF_NAME" = "staging" ]; then
              echo "$IMAGE:staging"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          push: true
          build-args: ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # platforms: linux/amd64   # descomente se runner e EC2 tiverem arquiteturas diferentes
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
          tags: ${{ steps.vars.outputs.tags }}
