name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      statuses: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

# FORMAT

      - name: Check Prettier formatting
        run: npx prettier --check .

# TEST

      - name: Run tests
        run: npm test -- --watch=false

# ANALYSIS 

      # - name: ESLint (quality + security)
      #   run: npm run lint -- --max-warnings=0

      # - name: Trivy (dependencies and secrets)
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     scan-type: fs                 
      #     scan-ref: frontend          
      #     scanners: vuln,secret         
      #     severity: CRITICAL,HIGH       
      #     ignore-unfixed: true          
      #     skip-dirs: "**/node_modules" 
      #     exit-code: "1"               

# BUILD
      
      - name: Build
        run: npm run build
